name: Dependency security audits

# Scheduled runs execute on the repository default branch (develop until migrated to main).
on:
  push:
    branches:
      - main
      - develop
      - feature/ceres-apptainer-refactor
  pull_request:
  schedule:
    - cron: '23 10 * * 1' # Mondays 10:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python requirements
        run: pip-audit --requirement backend/requirements.txt --format json --output pip-audit.json
      - name: Preserve Python audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 30

  frontend-dependencies:
    name: Frontend dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify frontend lockfile exists
        run: test -f frontend/package-lock.json
      - name: Verify reproducible installation
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit all frontend dependencies (high and critical fail)
        working-directory: frontend
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Preserve frontend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 30
