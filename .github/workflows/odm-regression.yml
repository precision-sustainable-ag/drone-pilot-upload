name: ODM regression safeguards

on:
  pull_request:
    paths:
      - 'scripts/submit-pending-odm.py'
      - 'scripts/retry-odm.py'
      - 'scripts/inspect-odm-retry.py'
      - 'scripts/odm-*-flight.sh'
      - 'tests/test_odm_*.py'
      - '.github/workflows/odm-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mocked-odm-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run dependency-free ODM regression tests
        run: python3 -m unittest discover -s tests -p 'test_odm_*.py' -v
