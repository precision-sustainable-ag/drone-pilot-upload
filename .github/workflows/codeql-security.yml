name: CodeQL security analysis

# Scheduled runs execute on the repository default branch (develop until migrated to main).
on:
  push:
    branches:
      - main
      - develop
      - feature/ceres-apptainer-refactor
  pull_request:
  schedule:
    - cron: '37 11 * * 3' # Wednesdays 11:37 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze code
        uses: github/codeql-action/analyze@v4
