[project]
name = "drone-pilot-upload"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py39"
line-length = 100
lint.select = ["E","F","W","I","B","C4","UP","ARG"]
lint.ignore = ["E203"]
# Only lint your subproject + its tests
include = ["ortho_processing/**/*.py", "ortho_processing/tests/**/*.py"]
exclude = [".venv", "venv", ".git", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = "(^\\.venv/|^venv/|^build/|^dist/)"
# Limit mypy to this subproject (CI can pass the path too)
files = ["ortho_processing"]
